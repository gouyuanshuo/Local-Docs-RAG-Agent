name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore locked backend environment
        run: >-
          uv sync --locked --all-extras
          --python "${{ matrix.python-version }}"

      - name: Ruff
        run: >-
          uv run --locked --all-extras python -m ruff check
          backend/src tests scripts

      - name: Ruff format
        run: >-
          uv run --locked --all-extras python -m ruff format --check
          backend/src tests scripts

      # DOC201 (a documented return value) is still a preview rule, so it runs
      # on its own rather than putting every other rule into preview mode.
      - name: Ruff docstring returns
        run: >-
          uv run --locked --all-extras python -m ruff check
          --preview --select DOC201
          backend/src scripts

      - name: Mypy
        run: uv run --locked --all-extras python -m mypy

      - name: Agents SDK registration regression
        run: >-
          uv run --locked --all-extras python -m pytest
          tests/test_agents_runtime.py -q -k real_sdk

      - name: Pytest
        run: uv run --locked --all-extras python -m pytest

      - name: Compile Python package
        run: >-
          uv run --locked --all-extras python -m compileall -q backend/src

  package:
    name: Wheel build and install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build wheel with pinned isolated requirements
        run: |
          mkdir -p "$RUNNER_TEMP/wheel-dist"
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel-dist"

      - name: Install and start API from wheel
        run: |
          requirements="$RUNNER_TEMP/wheel-runtime-requirements.txt"
          uv export --quiet --locked --no-dev --no-emit-project \
            --format requirements.txt --output-file "$requirements"
          wheel=$(find "$RUNNER_TEMP/wheel-dist" -maxdepth 1 -type f \
            -name 'local_docs_rag_agent-*.whl' -print -quit)
          smoke="$RUNNER_TEMP/wheel-smoke"
          run_dir="$RUNNER_TEMP/wheel-run"
          mkdir -p "$run_dir"
          uv venv --python 3.13 "$smoke"
          uv pip install --python "$smoke/bin/python" -r "$requirements"
          uv pip install --python "$smoke/bin/python" --no-deps "$wheel"
          cd "$run_dir"
          env -u PYTHONPATH "$smoke/bin/python" - <<'PY'
          import os
          import pathlib

          from fastapi import testclient
          import local_docs_rag_agent
          from local_docs_rag_agent.api import app as api_app

          module = pathlib.Path(local_docs_rag_agent.__file__).resolve()
          smoke = pathlib.Path(
              os.environ["RUNNER_TEMP"], "wheel-smoke"
          ).resolve()
          checkout = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          run_dir = pathlib.Path.cwd().resolve()
          assert not any(
              (parent / "pyproject.toml").is_file()
              for parent in (run_dir, *run_dir.parents)
          )
          assert module.is_relative_to(smoke), module
          assert not module.is_relative_to(checkout), module
          assert local_docs_rag_agent.__version__ == "0.1.0"
          client = testclient.TestClient(api_app.create_app())
          health = client.get("/api/health")
          root = client.get("/")
          assert health.status_code == 200, health.text
          assert health.json()["status"] == "ok"
          assert root.status_code == 200, root.text
          assert root.headers["content-type"].startswith("application/json")
          assert root.json()["name"] == "Local Docs RAG Agent API"
          print(module)
          PY

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend behavior
        run: pnpm --filter local-docs-rag-agent-web test

      - name: Build frontend
        run: pnpm run build
