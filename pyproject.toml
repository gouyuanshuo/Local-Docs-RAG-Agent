[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-docs-rag-agent"
version = "0.1.0"
description = "A local docs QA agent with RAG, citations, and eval harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "openai>=1.109.1",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
agents = [
    "openai-agents>=0.2.0",
]
qdrant = [
    "qdrant-client>=1.9.0",
]

[project.scripts]
local-docs-rag = "local_docs_rag_agent.cli:main"
local-docs-rag-api = "local_docs_rag_agent.api.app:run"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]
